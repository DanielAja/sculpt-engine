[package]
name = "sculpt-engine"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-AJA-Digital"
description = "Shared render and sculpt engine for Sculptor and Dream Builder"
publish = false

[lib]
# cdylib for the wasm module and the Android .so; staticlib for the Apple xcframework is built
# with `cargo rustc --crate-type staticlib` so native test builds stay fast.
crate-type = ["rlib", "cdylib"]

[features]
default = ["threads", "render"]
threads = ["dep:rayon"]
render = ["dep:wgpu", "dep:bytemuck"]
# Browser build: cargo build --target wasm32-unknown-unknown --no-default-features --features web
web = ["render", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1.12", optional = true }
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", optional = true, features = ["webgl"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["HtmlCanvasElement", "console"] }

[profile.wasm]
inherits = "release"
debug = 0
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[profile.release]
debug = 1
