[package]
name = "sculpt-engine"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-AJA-Digital"
description = "Shared render and sculpt engine for Sculptor and Dream Builder"
publish = false

[lib]
# Platform packages build staticlib or cdylib with `cargo rustc --crate-type` (E3 to E5).
crate-type = ["rlib"]

[features]
default = ["threads", "render"]
threads = ["dep:rayon"]
render = ["dep:wgpu", "dep:bytemuck"]

[dependencies]
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1.12", optional = true }
wgpu = { version = "30", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[profile.release]
debug = 1
